name: DAST Dynamic Security Scanning (OWASP ZAP)

on:
  schedule:
    # Run weekly DAST security scan on Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Baseline DAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build and Start Production Server
        run: |
          npm ci
          npm run build
          npm run start &
          npx wait-on http://localhost:3000

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
